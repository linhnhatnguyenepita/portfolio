---
# One-time bootstrap for a fresh Debian/Ubuntu VPS.
#
# Run this ONCE against a new box, connecting as root or a sudo-capable user:
#
#   VPS_HOST=1.2.3.4 \
#   ansible-playbook -i inventory.ini provision.yml \
#     -e "ansible_user=root" \
#     -e "deploy_user=deploy" \
#     -e "ssh_pubkey='ssh-ed25519 AAAA... you@host'"
#
# After this completes, deploy.yml (which connects as deploy_user) will work.
#
# Requires collections on the controller:
#   ansible-galaxy collection install community.docker community.general
- name: Provision portfolio VPS
  hosts: vps
  become: true
  gather_facts: true

  vars:
    deploy_user: "{{ lookup('env', 'VPS_USER') | default('deploy', true) }}"
    app_dir: /opt/portfolio
    app_port: 3000
    # Public key authorized for the deploy user's SSH login. Strongly
    # recommended so deploy.yml can connect as deploy_user with a key.
    ssh_pubkey: ""

  tasks:
    - name: Fail early on non-apt systems
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == 'Debian'
        fail_msg: "This playbook targets Debian/Ubuntu (apt). Adjust for {{ ansible_facts['os_family'] }}."

    # ------------------------------------------------------------------
    # Base packages + Docker's official apt repository
    # ------------------------------------------------------------------
    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
          - python3-docker
        state: present
        update_cache: true

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker's official GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
          {{ ansible_facts['distribution_release'] }} stable
        filename: docker
        state: present

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker is started and enabled on boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # ------------------------------------------------------------------
    # Deploy user
    # ------------------------------------------------------------------
    - name: Create deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true
        shell: /bin/bash
        create_home: true

    - name: Authorize SSH public key for deploy user
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ ssh_pubkey }}"
        state: present
      when: ssh_pubkey | length > 0

    # ------------------------------------------------------------------
    # Application directory + .env scaffold
    # ------------------------------------------------------------------
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0750"

    - name: Scaffold .env (only if it does not already exist)
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
        force: false
        content: |
          # Runtime environment for the portfolio container.
          # Fill in real values, then re-run deploy.yml.
          NEXT_PUBLIC_SANITY_PROJECT_ID=
          NEXT_PUBLIC_SANITY_DATASET=
          # Add any server-side secrets (Sanity write token, etc.) below.

    # ------------------------------------------------------------------
    # Firewall
    # ------------------------------------------------------------------
    - name: Allow OpenSSH through the firewall
      community.general.ufw:
        rule: allow
        name: OpenSSH

    - name: Allow the application port through the firewall
      community.general.ufw:
        rule: allow
        port: "{{ app_port }}"
        proto: tcp

    - name: Enable the firewall (default deny incoming)
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming
