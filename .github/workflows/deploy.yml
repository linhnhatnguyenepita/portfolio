name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

# Never cancel a deploy mid-flight; queue behind the current one instead.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    # For workflow_run triggers, only proceed when CI passed.
    # workflow_dispatch always runs unconditionally.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run does not set the SHA automatically; resolve it explicitly.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Capture the exact SHA we checked out — used as the image tag and
      # passed to the Ansible playbook so the VPS pulls the right image.
      - name: Resolve commit SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/linhnhatnguyenepita/portfolio
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_DATASET=${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------
      # Ansible deploy
      # ------------------------------------------------------------------

      - name: Install Ansible and community.docker collection
        run: |
          pip install --quiet ansible-core
          ansible-galaxy collection install community.docker

      - name: Write SSH private key to temp file
        run: |
          install -m 600 /dev/null /tmp/vps_deploy_key
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/vps_deploy_key

      - name: Run Ansible deploy playbook
        working-directory: ${{ github.workspace }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          ANSIBLE_PRIVATE_KEY_FILE: /tmp/vps_deploy_key
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/deploy.yml \
            -e "image_tag=${{ steps.sha.outputs.short }}"

      - name: Remove SSH private key
        if: always()
        run: rm -f /tmp/vps_deploy_key
