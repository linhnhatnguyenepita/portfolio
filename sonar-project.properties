sonar.organization=linhnhatnguyenepita
sonar.projectKey=linhnhatnguyenepita_portfolio
sonar.projectName=portfolio

# Source paths — directories and root-level entry files containing application code.
# app/         Next.js App Router pages, layouts, and components
# utils/       Shared utility helpers (e.g. cn.ts)
# middleware.js Next.js middleware (i18n routing)
sonar.sources=app,utils,middleware.js

# Exclude generated artifacts, vendored dependencies, and non-source assets.
sonar.exclusions=**/node_modules/**,**/.next/**,**/public/**,**/locales/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,ansible/**,docs/**,bun.lock,package-lock.json

# Point SonarCloud at the LCOV coverage report produced by your test runner.
# Generate it with: npx jest --coverage  (or vitest --coverage)
# The file will be created at coverage/lcov.info after tests run.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
